[JieJieBox]
sb-dir =
sb-config-file = config.json
; DEPRECATED: the tray no longer exposes TUN or system proxy switches.
; Both are decided by the sing-box configuration itself.
;   tun inbound  -> elevation is requested automatically
;   mixed inbound-> the Windows system proxy is configured automatically
; This key is accepted for compatibility with older installs and ignored.
tun-start-mode = off
; Selector menu layout: "auto", "flat" or "nested"
selector-menu-layout = auto
selector-persist = 1
; Optional log file (absolute path, or a name relative to the program folder).
log-file = JieJieBox.log
